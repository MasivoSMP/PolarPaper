name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Compute version
        id: version
        shell: bash
        run: |
          short="${GITHUB_SHA::7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "value=dev-$short" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: ./gradlew --no-daemon -Pversion="${{ steps.version.outputs.value }}" build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ steps.version.outputs.short }}
          target_commitish: ${{ github.sha }}
          name: Development Build ${{ steps.version.outputs.short }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          body: |
            Automated build from `${{ github.sha }}`.

            ${{ github.event.head_commit.message }}
          files: |
            build/libs/polarpaper-${{ steps.version.outputs.value }}.jar
            LICENSE
